<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="The Luxe Jewels">
  <defs>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C1D4"/>
      <stop offset="45%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#B01045"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0A8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C1A"/>
    </linearGradient>
  </defs>

  <!-- Cream tile -->
  <rect width="512" height="512" rx="118" fill="#FDFBF7"/>
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.55"/>

  <!-- Diamond sparkle -->
  <g transform="translate(256 108)">
    <path d="M0 -28 L22 0 L0 28 L-22 0 Z" fill="url(#gold)"/>
    <path d="M0 -28 L22 0 L0 6 Z" fill="#FFF6D6" opacity="0.55"/>
  </g>

  <!-- LJ monogram -->
  <text
    x="256"
    y="340"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="210"
    font-weight="700"
    fill="url(#rose)"
    letter-spacing="-10"
  >LJ</text>

  <!-- Soft underline -->
  <path
    d="M150 372 C210 392, 302 392, 362 372"
    fill="none"
    stroke="url(#gold)"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.8"
  />
</svg>
